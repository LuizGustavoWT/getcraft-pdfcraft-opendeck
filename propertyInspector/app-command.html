<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PdfCraft App Tool</title><link rel="stylesheet" href="run.css"></head>
<body><main>
  <h1>PdfCraft App Tool</h1><p class="hint">Start PdfCraft with <code>pdfcraft --control ~/.pdfcraft-control.json</code>. Keep that file private.</p>
  <label>CLI executable<input id="executable" placeholder="pdfcraft-cli"></label><label>Private control file<input id="controlFile" placeholder="/home/me/.pdfcraft-control.json"></label>
  <label>Command<select id="command"><option value="previous_page">Previous page</option><option value="next_page">Next page</option><option value="read_mode">Toggle read mode</option><option value="organize">Organize pages</option><option value="rotate_cw">Rotate selected/current page clockwise</option><option value="rotate_ccw">Rotate selected/current page counter-clockwise</option><option value="comments">Open comments</option><option value="highlight">Highlight text tool</option><option value="rectangle">Rectangle comment tool</option><option value="redact">Mark for redaction</option><option value="apply_redactions">Apply redactions (opens confirmation)</option><option value="save">Save active PDF</option></select></label>
  <div class="grid"><label>Key title<input id="title" placeholder="Highlight"></label><label>Timeout (seconds)<input id="timeoutSeconds" type="number" min="1" max="300" value="30"></label></div><label class="check"><input id="showOutput" type="checkbox"><span>Show result on key</span></label><p id="status" role="status">Choose a command, then press the key.</p>
</main><script src="shared.js"></script><script>PdfDeck.bind(["executable","controlFile","command","title","timeoutSeconds","showOutput"], {command:"highlight",timeoutSeconds:30});</script></body></html>
